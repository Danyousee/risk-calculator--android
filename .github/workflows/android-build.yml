name: Build Android APK (RiskCalculator)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Compile & Assemble Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiskCalculator-v1.0.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Log Build Information
        run: |
          echo "============================================"
          echo "✅ Android APK successfully compiled!"
          echo "App Name: Risk Calculator "
          echo "Package ID: com.futurejurnalvercelapp.app"
          echo "Target Version: 1.0.0 (1)"
          echo "============================================"
