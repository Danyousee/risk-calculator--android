<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Risk Calculator  - Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f6f6ef;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background-color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px #2563eb55;
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; margin-bottom: 24px; max-width: 280px; line-height: 1.5; }
        .retry-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 240px;
        }
    </style>
</head>
<body>
    <div class="icon">R</div>
    <h1>No Connection</h1>
    <p>Please check your internet connection to use Risk Calculator .</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
